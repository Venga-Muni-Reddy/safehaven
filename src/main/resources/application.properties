spring.application.name=SafeHaven
server.port=${PORT:8080}
# Database: set DATABASE_URL / DB_USER / DB_PASSWORD in the host's env. Falls back to in-memory H2 for local demo.
spring.datasource.url=${DB_URL:jdbc:h2:mem:safehaven;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Email is optional. Set MAIL_USERNAME / MAIL_PASSWORD (an app password) to enable.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
management.health.mail.enabled=false
logging.level.org.springframework=INFO
seed.password=${SEED_PASSWORD:}
